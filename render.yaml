services:
  - type: web
    name: telegram-video-forwarder
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python auto_forwarder.py
    plan: free
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: TARGET_CHAT_ID
        value: 4402901248
      - key: CAPTION_MODE
        value: original
